</style></head><body><canvas id="c"></canvas><div id="hud"><div class="stats"><div class="s">COLD <b id="cold">-8°</b><div class="bar"><i id="wb"></i></div></div><div class="s">FOOD <b id="food">82</b><div class="bar"><i id="fb"></i></div></div><div class="s">WATER <b id="water">78</b><div class="bar"><i id="tb"></i></div></div><div class="s">REST <b id="rest">91</b><div class="bar"><i id="rb"></i></div></div></div><div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="buttons"><button class="b" id="inv">🎒</button><button class="b" id="craft">🔥</button><button class="b action" id="act">✋</button></div></div></div><div id="prompt"></div><div id="toast"></div><div class="panel" id="ip"><div class="sheet"><button class="close">×</button><h2>Pack</h2><div class="grid" id="ig"></div></div></div><div class="panel" id="cp"><div class="sheet"><button class="close">×</button><h2>Craft</h2><div class="grid" id="cg"></div></div></div><div id="intro"><div class="intro"><small>MOBILE SURVIVAL · GREECE</small><h1>AEGEAN <span>DARK</span></h1><p>A freak winter has buried a Greek island village. Scavenge chocolate-hazelnut food, fruit soda, wood and matches. Stay warm and reach the chapel before the cold wins.</p><button class="start" id="start">ENTER THE VILLAGE</button></div></div><script>

const M=['111111111111111111','100000000000000001','102220001111004401','102020001001004001','102020001001004401','102220001001000001','100000001001111101','101110001000000001','101010001111100001','101010000000100001','101011111000101101','100000001000100001','111100001111100001','103310000000000001','103010111110111101','103330100010000001','100000100010000001','111111111111111111'],mh=M.length,mw=M[0].length,cell=(a,b)=>{a=Math.floor(a);b=Math.floor(b);return a<0||b<0||a>=mw||b>=mh?'1':M[b][a]},solid=(a,b)=>cell(a,b)!=='0';let p={x:3.4,y:11.5,a:-.2,w:66,f:82,t:78,r:91,temp:-8};let bag={spread:1,soda:1,bar:2,wood:1,matches:3,cloth:0},fire=0;const E=[{x:6.2,y:11.4,t:'spread',n:'Hazelnut spread'},{x:8.5,y:5.5,t:'wood',n:'Olive wood'},{x:13.3,y:8.5,t:'soda',n:'Fruit fizz'},{x:15.3,y:4.7,t:'bar',n:'Cocoa bar'},{x:13.4,y:13.5,t:'cloth',n:'Wool scarf'},{x:7.5,y:15.4,t:'matches',n:'Matches'},{x:9.5,y:13.5,t:'fire',n:'Cold fire pit'},{x:14.6,y:5.5,t:'chapel',n:'Agios Nikolaos chapel'}];
const items={spread:['🍫','Hazelnut Spread','+32 food',()=>{bag.spread--;p.f=cl(p.f+32)}],soda:['🍊','Fruit Fizz','+26 water',()=>{bag.soda--;p.t=cl(p.t+26)}],bar:['▰','Cocoa Bar','+18 food',()=>{bag.bar--;p.f=cl(p.f+18)}],wood:['🪵','Olive Wood','Fire fuel'],matches:['🔥','Matches','Starts fire'],cloth:['🧣','Wool Cloth','Warmth material']};let tt;function toast(s){Q('#toast').textContent=s;Q('#toast').classList.add('on');clearTimeout(tt);tt=setTimeout(()=>Q('#toast').classList.remove('on'),1500)}
function ray(a){let ca=Math.cos(a),sa=Math.sin(a),d=0;while(d<20){d+=.025;if(solid(p.x+ca*d,p.y+sa*d))return[d,cell(p.x+ca*d,p.y+sa*d)]}return[20,'1']}function world(){let sky=x.createLinearGradient(0,0,0,H*.55);sky.addColorStop(0,'#0a1420');sky.addColorStop(1,'#26384a');x.fillStyle=sky;x.fillRect(0,0,W,H*.55);let gr=x.createLinearGradient(0,H*.45,0,H);gr.addColorStop(0,'#b8c5ce');gr.addColorStop(1,'#67737b');x.fillStyle=gr;x.fillRect(0,H*.45,W,H*.55);let rays=Math.min(260,Math.floor(W/2)),fov=1.05;for(let i=0;i<rays;i++){let a=p.a-fov/2+fov*i/rays,[d,m]=ray(a);d*=Math.cos(a-p.a);let h=Math.min(H*1.6,H/(d+.08)),y=(H-h)/2,shade=cl(1-d/13,0,1),c=m==='2'?[72,88,101]:m==='3'?[78,68,57]:m==='4'?[55,72,86]:[62,72,79];x.fillStyle=`rgb(${c[0]*shade},${c[1]*shade},${c[2]*shade})`;x.fillRect(i*W/rays,y,W/rays+1,h)}entities();snow()}

function hud(){[['#wb',p.w],['#fb',p.f],['#tb',p.t],['#rb',p.r]].forEach(z=>Q(z[0]).style.width=cl(z[1])+'%');Q('#cold').textContent=p.temp+'°';Q('#food').textContent=Math.round(p.f);Q('#water').textContent=Math.round(p.t);Q('#rest').textContent=Math.round(p.r)}function update(dt){if(!run)return;let f=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0)-joy.y,st=(keys.d?1:0)-(keys.a?1:0)+joy.x;if(keys.ArrowLeft)p.a-=dt*1.8;if(keys.ArrowRight)p.a+=dt*1.8;let m=Math.hypot(f,st);if(m>1)f/=m,st/=m;move(p.x+(Math.cos(p.a)*f+Math.cos(p.a+Math.PI/2)*st)*dt*2,p.y+(Math.sin(p.a)*f+Math.sin(p.a+Math.PI/2)*st)*dt*2);let nf=fire&&Math.hypot(p.x-9.5,p.y-13.5)<2;p.w=cl(p.w+(nf?dt*.9:-dt*.05));p.f=cl(p.f-dt*.025);p.t=cl(p.t-dt*.04);p.r=cl(p.r-dt*(m>.2?.02:.007));p.temp=Math.round(-4-(1-p.w/100)*12+(nf?9:0));if(fire){fire-=dt;if(fire<=0)toast('The fire died')}hud();prompt()}

Q('#start').onclick=()=>{run=1;Q('#intro').style.display='none';last=performance.now()};Q('#act').onclick=act;Q('#inv').onclick=inv;Q('#craft').onclick=craft;document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.panel').classList.remove('on'));document.querySelectorAll('.panel').forEach(a=>a.onclick=e=>{if(e.target===a)a.classList.remove('on')});let J=Q('#joy'),S=Q('#stick');function ju(e){let r=J.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,L=r.width*.31,m=Math.hypot(dx,dy);if(m>L)dx*=L/m,dy*=L/m;joy.x=dx/L;joy.y=dy/L;S.style.transform=`translate(${dx}px,${dy}px)`}J.onpointerdown=e=>{joy.id=e.pointerId;J.setPointerCapture(e.pointerId);ju(e)};J.onpointermove=e=>{if(e.pointerId===joy.id)ju(e)};J.onpointerup=J.onpointercancel=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;S.style.transform=''}};C.onpointerdown=e=>{look=[e.pointerId,e.clientX];C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(look&&e.pointerId===look[0])p.a+=(e.clientX-look[1])*.0065,look[1]=e.clientX};C.onpointerup=C.onpointercancel=e=>{if(look&&e.pointerId===look[0])look=null};onkeydown=e=>keys[e.key]=keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key]=keys[e.key.toLowerCase()]=0;function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);world();requestAnimationFrame(loop)}hud();requestAnimationFrame(loop)})();
